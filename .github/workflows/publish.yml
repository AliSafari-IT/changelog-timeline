name: Publish

on:
  push:
    # Run on all branches except gh-pages and on version tags
    branches:
      - "**"
      - "!gh-pages"
    tags:
      - "v*"

# contents: write is needed for gh-pages deployment (jobs can override if needed)
permissions:
  contents: write

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @asafarim/changelog-timeline-demo run build

  publish-release:
    name: Publish stable on tag
    if: startsWith(github.ref, 'refs/tags/v') # only v* tags
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Publish to NPM (latest)
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy_pages:
    name: Deploy docs to GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_PATH: /changelog-timeline/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build library only
        run: pnpm run build
      - name: Build demo with base path
        run: pnpm --filter @asafarim/changelog-timeline-demo run build
      - run: echo "Build complete. Checking changelog-demo/dist contents..."
      - run: ls -la changelog-demo/dist/ || echo "changelog-demo/dist does not exist"
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: changelog-demo/dist
          force_orphan: true

<svg viewBox="0 0 100 100" role="img" aria-labelledby="favicon-title" xmlns="http://www.w3.org/2000/svg">
  <title id="favicon-title">Changelog Timeline</title>
  <defs>
    <linearGradient id="favicon-surface" x1="12" y1="10" x2="88" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#304FFE"/>
      <stop offset="1" stop-color="#1E40FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0F172A"/>
  <rect x="3" y="3" width="94" height="94" rx="21" fill="url(#favicon-surface)"/>

  <!-- Timeline line -->
  <path d="M50 16V84" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>

  <!-- Dots -->
  <circle cx="50" cy="25" r="6" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="8" fill="#FFFFFF"/>
  <circle cx="50" cy="75" r="6" fill="#FFFFFF"/>

  <!-- Left card indicator -->
  <rect x="13" y="17" width="30" height="17" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="19" y="23" width="15" height="3" rx="1.5" fill="#304FFE"/>
  <path d="M43 25H47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Right card indicator -->
  <rect x="57" y="66" width="30" height="17" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="63" y="72" width="15" height="3" rx="1.5" fill="#F59E0B"/>
  <path d="M53 75H57" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
